<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Kali Gateway</title>
<style>
  :root { color-scheme: dark; --bg:#0b0e14; --card:#131824; --fg:#e6edf3; --muted:#8b98a9; --acc:#367bf0; --err:#ff6b6b; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--fg);
         font:16px/1.5 system-ui, sans-serif; padding:16px; }
  main { width:100%; max-width:380px; background:var(--card); border-radius:12px; padding:28px; }
  h1 { margin:0 0 4px; font-size:1.3rem; } p { margin:0 0 20px; color:var(--muted); font-size:.9rem; }
  input, button { width:100%; padding:12px; border-radius:8px; border:1px solid #2a3347; font:inherit; }
  input { background:#0b0e14; color:var(--fg); margin-bottom:12px; }
  button { background:var(--acc); color:#fff; border:0; cursor:pointer; margin-bottom:8px; }
  button.ghost { background:transparent; border:1px solid #2a3347; color:var(--muted); }
  #err { color:var(--err); min-height:1.4em; font-size:.85rem; }
  [hidden] { display:none; }
</style>
</head>
<body>
<main>
  <h1>Kali Gateway</h1>
  <p>Private access only.</p>

  <form id="login" hidden>
    <input id="pw" type="password" placeholder="Password" autocomplete="current-password" required autofocus>
    <button type="submit">Unlock</button>
  </form>

  <div id="dash" hidden>
    <button id="open">Open Kali terminal</button>
    <button id="out" class="ghost">Sign out</button>
  </div>
  <div id="err" role="alert"></div>
</main>
<script>
const $ = (id) => document.getElementById(id);
async function refresh() {
  const { authenticated } = await (await fetch('/api/session')).json();
  $('login').hidden = authenticated;
  $('dash').hidden = !authenticated;
}
$('login').addEventListener('submit', async (e) => {
  e.preventDefault(); $('err').textContent = '';
  const r = await fetch('/api/login', { method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ password: $('pw').value }) });
  $('pw').value = '';
  if (!r.ok) { $('err').textContent = (await r.json()).error || 'Failed'; return; }
  refresh();
});
$('open').addEventListener('click', () => window.open('/api/connect', '_blank', 'noopener'));
$('out').addEventListener('click', async () => { await fetch('/api/logout', { method:'POST' }); refresh(); });
refresh();
</script>
</body>
</html>
